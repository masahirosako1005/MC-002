<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>講 — プレゼンテーション</title>
  <style>
    @font-face { font-family: "Yuji Mai"; src: url("../frontend/public/fonts/yujimai/YujiMai-Regular.woff2") format("woff2"); font-weight: 400; font-display: swap; }
    :root { --paper:#fafbf8; --ink:#192724; --muted:#63706a; --vermilion:#b63d30; --forest:#2e6254; --line:#d6ddd6; --body:Meiryo,"Yu Gothic","Hiragino Kaku Gothic ProN",sans-serif; --footer-height:58px; }
    * { box-sizing:border-box; }
    [hidden] { display:none !important; }
    html { background:var(--paper); }
    body { margin:0; height:100vh; height:100svh; overflow:hidden; color:var(--ink); font-family:var(--body); line-height:1.6; background:linear-gradient(#fafbf8f5,#fafbf8f5),url("../frontend/public/art/wa/washi-paper-v1.webp"); -webkit-font-smoothing:antialiased; }
    p,h1,h2,h3,figure { margin:0; }
    img { display:block; max-width:100%; }
    a { color:var(--forest); text-underline-offset:.2em; }
    button { font:inherit; cursor:pointer; }
    button,a { touch-action:manipulation; }
    button,video,a { -webkit-tap-highlight-color:transparent; }
    button:disabled { cursor:default; opacity:.3; }
    button:focus-visible,a:focus-visible,video:focus-visible,[tabindex]:focus-visible { outline:3px solid var(--vermilion); outline-offset:4px; }
    .visually-hidden { position:absolute !important; width:1px !important; height:1px !important; padding:0 !important; margin:-1px !important; overflow:hidden; clip-path:inset(50%); white-space:nowrap; border:0; }
    .deck { height:calc(100vh - var(--footer-height)); height:calc(100svh - var(--footer-height)); overflow:auto; scrollbar-gutter:stable; }
    .deck.theater-mode { scrollbar-gutter:auto; background:#172320; scrollbar-color:#708179 #172320; }
    .slide { height:100%; min-height:660px; max-width:1600px; margin:auto; padding:34px clamp(36px,4.6vw,76px) 24px; display:grid; grid-template-rows:auto minmax(0,1fr) auto; gap:26px; }
    .slide-header { display:flex; justify-content:space-between; gap:32px; align-items:flex-start; }
    .slide-header>div { min-width:0; }
    .eyebrow { color:var(--vermilion); font-size:14px; font-weight:700; letter-spacing:.09em; margin-bottom:12px; }
    .eyebrow::before { content:""; display:inline-block; width:22px; height:3px; background:currentColor; vertical-align:middle; margin-right:12px; }
    .slide-title { font-family:var(--body); font-size:clamp(34px,3.3vw,50px); font-weight:700; line-height:1.38; letter-spacing:-.035em; text-wrap:balance; }
    .folio { padding-top:2px; color:#849189; font-size:14px; font-variant-numeric:tabular-nums; white-space:nowrap; }
    .slide-body { min-width:0; min-height:0; }
    .lead { font-size:clamp(21px,1.9vw,27px); line-height:1.65; text-wrap:pretty; }
    .takeaway { font-size:clamp(26px,2.6vw,37px); font-weight:700; letter-spacing:-.025em; line-height:1.5; text-wrap:balance; }
    .slide-footnote { padding-top:10px; border-top:1px solid var(--line); font-size:13px; color:var(--muted); line-height:1.65; }
    .content-stack { display:flex; flex-direction:column; gap:24px; }
    .visual { min-width:0; min-height:0; height:100%; }
    .visual img { width:100%; height:100%; object-fit:contain; object-position:center; }
    .visual.phone { position:relative; width:100%; height:100%; padding:10px 0; }
    .visual.phone img { filter:drop-shadow(0 12px 18px #15251e15); }
    .visual figcaption { font-size:13px; color:var(--muted); margin-top:8px; }
    .friction-layout { display:flex; flex-direction:column; gap:18px; }
    .service-islands { position:relative; flex:1; min-height:300px; isolation:isolate; }
    .service-links { position:absolute; inset:0; width:100%; height:100%; z-index:-1; overflow:visible; }
    .service-window { position:absolute; width:28%; padding:0 24px 24px; border:1px solid #bec8c0; background:#fff; box-shadow:0 15px 35px #1430240c; }
    .service-window:nth-of-type(1) { left:1%; top:6%; transform:rotate(-2deg); }
    .service-window:nth-of-type(2) { left:36%; top:36%; transform:rotate(1.5deg); }
    .service-window:nth-of-type(3) { right:0; top:2%; transform:rotate(-1deg); }
    .window-bar { display:flex; justify-content:space-between; align-items:center; height:36px; margin:0 -24px 19px; padding:0 15px; background:#f2f5f0; border-bottom:1px solid #e0e5df; color:#849189; font-size:12px; letter-spacing:.08em; }
    .window-dots { display:flex; gap:5px; }
    .window-dots i { width:5px; height:5px; border-radius:50%; background:#a9b7ae; }
    .service-name { font-size:clamp(25px,2.55vw,38px); line-height:1.4; letter-spacing:-.04em; font-weight:700; }
    .service-action { font-size:23px; margin-top:17px; color:var(--muted); line-height:1.6; }
    .service-instagram { color:var(--vermilion); }
    .service-line { color:var(--forest); }
    .friction-layout>.takeaway { align-self:flex-start; padding-left:22px; border-left:4px solid var(--vermilion); }
    .essence-layout { display:flex; flex-direction:column; gap:24px; }
    .continuous-journey { position:relative; flex:1; min-height:260px; padding:70px 0 0; }
    .journey-line { position:absolute; top:76px; left:0; width:100%; height:130px; overflow:visible; }
    .journey-stops { position:relative; display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:55px; list-style:none; margin:0; padding:0 15px; }
    .journey-stops li { padding-top:41px; }
    .journey-stops h3 { width:fit-content; padding:0 15px 0 0; background:var(--paper); font-size:30px; line-height:1.5; font-weight:700; }
    .journey-stops p { margin-top:15px; max-width:15em; font-size:20px; line-height:1.7; color:var(--muted); }
    .journey-destination { display:flex; align-items:baseline; justify-content:space-between; gap:22px; padding-top:24px; border-top:1px solid var(--line); }
    .journey-destination span { font-size:25px; }
    .journey-destination strong { color:var(--vermilion); font-size:clamp(35px,4.5vw,62px); line-height:1.3; letter-spacing:-.04em; }
    .cover .slide-header { min-height:34px; }
    .cover .slide-title { position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%); }
    .intro-composition { position:relative; isolation:isolate; display:grid; grid-template-columns:240px 1fr; grid-template-rows:1fr auto; gap:26px 60px; align-items:center; }
    .brand-seal { width:230px; height:230px; display:grid; place-items:center; color:var(--vermilion); border:4px solid currentColor; outline:1px solid currentColor; outline-offset:-12px; font-family:"Yuji Mai",serif; font-size:178px; line-height:1; transform:rotate(-4deg); }
    .brand-definition { margin-top:24px; max-width:15em; font-size:19px; color:var(--muted); }
    .intro-copy { align-self:center; max-width:800px; }
    .intro-copy .lead { font-size:clamp(32px,3.45vw,50px); line-height:1.6; letter-spacing:-.04em; font-weight:700; }
    .intro-copy.has-matching { display:flex; flex-direction:column; gap:25px; max-width:none; }
    .intro-copy.has-matching .lead { font-size:clamp(28px,2.6vw,37px); line-height:1.55; }
    .matching-equation { display:grid; grid-template-columns:minmax(0,1fr) 34px minmax(0,1fr); gap:19px; align-items:center; }
    .matching-input { border-bottom:2px solid var(--ink); padding-bottom:15px; }
    .matching-input h3 { color:var(--muted); font-size:17px; font-weight:400; margin-bottom:8px; }
    .matching-input p { font-size:24px; line-height:1.6; font-weight:600; text-wrap:balance; }
    .matching-input .matching-permission { font-size:17px; font-weight:400; color:var(--muted); margin-top:8px; }
    .matching-times { color:var(--vermilion); font-size:43px; font-weight:400; text-align:center; }
    .matching-result { display:grid; grid-template-columns:34px minmax(0,1fr); gap:17px; align-items:start; }
    .matching-result-arrow { color:var(--vermilion); font-size:32px; line-height:1.4; }
    .matching-result h3 { font-size:27px; line-height:1.5; color:var(--vermilion); text-wrap:balance; }
    .matching-result p { font-size:18px; margin-top:8px; color:var(--muted); }
    .intro-composition.with-matching .woodcut { opacity:.12; }
    .lead-phrase { display:inline-block; max-width:100%; }
    .woodcut { position:absolute; z-index:-1; width:68%; height:90%; right:-5%; bottom:-9%; opacity:.22; mix-blend-mode:multiply; mask-image:radial-gradient(ellipse at 53% 50%,#000 24%,transparent 69%); }
    .woodcut img { width:100%; height:100%; object-fit:contain; }
    .proposal-steps { grid-column:1/-1; display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); list-style:none; margin:0; padding:0; gap:0; }
    .proposal-steps li { position:relative; padding:18px 25px 0 0; border-top:2px solid var(--ink); }
    .proposal-steps li+li { padding-left:25px; }
    .proposal-steps li+li::before { content:""; position:absolute; left:-5px; top:-6px; width:10px; height:10px; border-radius:50%; background:var(--vermilion); }
    .proposal-index { display:block; color:var(--vermilion); font-size:15px; margin-bottom:10px; font-variant-numeric:tabular-nums; }
    .proposal-steps p { font-size:23px; font-weight:600; line-height:1.7; }
    .evidence-layout { display:grid; grid-template-columns:minmax(0,1fr) 225px; grid-template-rows:auto 1fr auto; gap:22px 64px; }
    .evidence-layout>.lead,.evidence-layout>.takeaway { grid-column:1/-1; }
    .comparison-chart { display:flex; flex-direction:column; justify-content:center; gap:32px; }
    .comparison-row { display:grid; grid-template-columns:170px 1fr; column-gap:25px; align-items:center; }
    .comparison-label { font-size:26px; line-height:1.5; font-weight:700; }
    .comparison-result { display:flex; gap:17px; align-items:baseline; }
    .comparison-result strong { font-size:clamp(55px,5.9vw,84px); line-height:1.1; font-variant-numeric:tabular-nums; letter-spacing:-.055em; }
    .comparison-result small { font-size:20px; font-weight:400; }
    .comparison-result span { font-size:17px; color:var(--muted); }
    .bar-track { grid-column:2; height:23px; margin-top:14px; background:#e7ede7; }
    .bar-fill { height:100%; background:var(--vermilion); }
    .comparison-row:nth-child(2) .bar-fill { background:var(--forest); }
    .chart-scale { margin-left:195px; display:flex; justify-content:space-between; color:var(--muted); font-size:12px; margin-top:-18px; font-variant-numeric:tabular-nums; }
    .sample-total { align-self:center; border-left:1px solid var(--line); padding:35px 0 35px 36px; }
    .sample-total span { display:block; color:var(--muted); font-size:18px; }
    .sample-total strong { display:block; font-size:65px; font-weight:600; line-height:1.3; letter-spacing:-.06em; }
    .sample-total small { font-size:19px; }
    .evidence-layout>.takeaway { font-size:25px; padding-top:14px; border-top:1px solid var(--line); }
    .slide.video { background:#172320; color:#f9fbf7; max-width:none; gap:16px; padding-top:22px; padding-bottom:18px; }
    .video .slide-header { align-items:center; }
    .video .eyebrow { color:#e4a499; margin-bottom:7px; }
    .video .slide-title { font-size:clamp(29px,2.65vw,39px); }
    .video .folio { color:#a8b8af; }
    .video .slide-body { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; }
    .video .lead { font-size:18px; color:#cad4cd; }
    .video-frame { width:min(100%,1100px,calc((100svh - 340px) * 16 / 9)); }
    .video-frame video { display:block; width:100%; aspect-ratio:16/9; background:#0c1411; box-shadow:0 16px 50px #0004; }
    .video-caption { margin-top:8px; color:#c2cfc5; font-size:12px; }
    .video .slide-footnote { border-color:#40534a; color:#c2cfc5; font-size:12px; }
    .video-print { display:none; }
    .program-layout { display:grid; grid-template-columns:minmax(0,1fr) 280px; gap:55px; align-items:stretch; }
    .program-copy { display:flex; flex-direction:column; justify-content:space-between; gap:25px; padding:22px 0; }
    .pottery-timeline { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:0; list-style:none; margin:0; padding:0; }
    .pottery-timeline li { position:relative; padding:0 24px 0 0; }
    .pottery-timeline li+li { padding-left:24px; }
    .pottery-timeline li::before { content:""; position:absolute; left:0; right:0; top:45px; height:2px; background:var(--ink); z-index:0; }
    .visit-number { position:relative; display:inline-block; padding:0 15px 0 0; background:var(--paper); color:var(--vermilion); font-size:62px; line-height:1.3; font-weight:600; letter-spacing:-.06em; }
    .visit-number small { margin-left:5px; font-size:16px; font-weight:400; letter-spacing:0; }
    .pottery-timeline h3 { margin-top:23px; font-size:31px; font-weight:700; }
    .pottery-timeline p { margin-top:10px; font-size:20px; color:var(--muted); }
    .program-copy>.takeaway { font-size:25px; max-width:26em; }
    .leader-layout { display:grid; grid-template-columns:minmax(0,1fr) 260px; gap:65px; }
    .leader-copy { display:flex; flex-direction:column; gap:22px; }
    .contribution-stairs { position:relative; flex:1; min-height:280px; }
    .stairs-line { position:absolute; top:0; left:0; width:100%; height:145px; }
    .contribution-steps { list-style:none; padding:0; margin:0; display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:22px; position:relative; }
    .contribution-steps li { padding:145px 0 0; }
    .contribution-steps li:nth-child(2) { padding-top:85px; }
    .contribution-steps li:nth-child(3) { padding-top:25px; }
    .contribution-steps h3 { font-size:27px; margin-top:7px; }
    .contribution-steps p { font-size:19px; color:var(--muted); margin-top:9px; }
    .step-index { color:var(--vermilion); font-size:16px; font-variant-numeric:tabular-nums; }
    .leader-copy>.takeaway { border-top:1px solid var(--line); padding-top:18px; font-size:24px; }
    .zone-layout { display:grid; grid-template-columns:minmax(0,1.05fr) minmax(0,.9fr) 245px; grid-template-rows:auto 1fr; gap:20px 42px; }
    .zone-layout>.lead { grid-column:1/3; }
    .zone-layout>.visual { grid-column:3; grid-row:1/3; }
    .target-figure { min-width:0; align-self:center; }
    .target-svg { width:100%; max-height:390px; display:block; }
    .target-figure figcaption { text-align:center; color:var(--muted); font-size:13px; margin-top:5px; }
    .zone-copy { display:flex; flex-direction:column; justify-content:center; gap:28px; }
    .zone-range { color:var(--vermilion); font-size:clamp(50px,5.5vw,78px); line-height:1.2; font-weight:700; letter-spacing:-.06em; white-space:nowrap; }
    .zone-range small { font-size:25px; letter-spacing:0; }
    .zone-points { list-style:none; margin:0; padding:0; display:grid; gap:18px; }
    .zone-points li { border-top:1px solid var(--line); padding-top:15px; font-size:21px; }
    .provider-layout { display:grid; grid-template-columns:minmax(0,1fr) 255px; gap:30px; grid-template-rows:auto minmax(0,1fr); }
    .provider-layout>.lead { grid-column:1/-1; font-size:23px; }
    .provider-layout .visual { grid-row:2; grid-column:1; }
    .provider-layout .visual img { object-position:left center; filter:drop-shadow(0 10px 22px #16291e12); }
    .provider-points { align-self:center; list-style:none; margin:0; padding:0; display:grid; gap:28px; }
    .provider-points li { border-left:3px solid var(--vermilion); padding-left:20px; font-size:24px; line-height:1.6; font-weight:600; text-wrap:balance; }
    .deck-footer { position:relative; height:var(--footer-height); border-top:1px solid var(--line); display:flex; align-items:center; gap:24px; padding:6px clamp(16px,3vw,44px); font-size:13px; background:#f8faf6; }
    .deck-brand { color:var(--muted); font-family:"Yuji Mai",serif; font-size:23px; }
    .slide-nav { display:flex; align-items:center; gap:9px; }
    .slide-counter { min-width:48px; text-align:center; font-variant-numeric:tabular-nums; }
    .footer-actions { margin-left:auto; display:flex; align-items:center; gap:6px; }
    .control { min-height:42px; padding:8px 12px; border:1px solid transparent; background:transparent; color:var(--ink); border-radius:2px; line-height:1.3; }
    .control:hover:enabled { background:#e8eee6; }
    .control:active:enabled { transform:scale(.97); }
    .control[aria-expanded="true"],.control[aria-pressed="true"] { border-color:var(--vermilion); color:var(--vermilion); }
    .nav-control { width:44px; font-size:23px; padding:6px; }
    .timer-text { min-width:101px; display:inline-block; font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; }
    .timer-text.over { color:var(--vermilion); font-weight:700; }
    .progress { position:absolute; top:-2px; left:0; width:100%; height:2px; border:0; appearance:none; background:#dce3da; color:var(--vermilion); }
    .progress::-webkit-progress-bar { background:#dce3da; }
    .progress::-webkit-progress-value { background:var(--vermilion); }
    .progress::-moz-progress-bar { background:var(--vermilion); }
    .notes-panel { position:fixed; z-index:20; top:0; right:0; bottom:var(--footer-height); width:min(550px,94vw); padding:28px; overflow:auto; background:#fff; border-left:2px solid var(--line); box-shadow:-10px 0 30px #14281b18; }
    .notes-heading { display:flex; justify-content:space-between; align-items:center; gap:20px; padding-bottom:15px; border-bottom:1px solid var(--line); }
    .notes-heading h2 { font-size:22px; }
    .notes-title { margin-top:22px; font-size:22px; }
    .notes-time { margin-top:8px; color:var(--muted); font-size:14px; }
    .notes-speaker { border-left:4px solid var(--vermilion); padding-left:16px; margin-top:22px; }
    .notes-speaker strong { display:block; font-size:25px; }
    .notes-speaker span { display:block; color:var(--muted); font-size:14px; margin-top:5px; }
    .notes-handoff { margin-top:24px; border-top:1px solid var(--line); padding-top:18px; }
    .notes-handoff strong { color:var(--vermilion); font-size:17px; }
    .notes-handoff p { margin-top:8px; font-size:18px; line-height:1.8; }
    .notes-copy { margin-top:23px; font-size:19px; line-height:1.9; white-space:pre-line; }
    .notes-copy p+p { margin-top:1em; }
    .notes-sources { margin-top:22px; display:grid; gap:8px; font-size:13px; overflow-wrap:anywhere; }
    .notes-help { margin-top:28px; padding-top:16px; border-top:1px solid var(--line); color:var(--muted); font-size:13px; }
    .load-error { padding:48px; max-width:760px; font-size:20px; }
    @media(min-width:1001px) and (max-height:760px) {
      .slide { min-height:0; padding-top:23px; padding-bottom:18px; gap:19px; }
      .slide-title { font-size:36px; }
      .eyebrow { margin-bottom:8px; font-size:12px; }
      .lead { font-size:22px; }
      .takeaway { font-size:29px; }
      .service-islands { min-height:245px; }
      .service-window { padding:0 20px 19px; }
      .window-bar { margin:0 -20px 14px; height:30px; }
      .service-name { font-size:28px; }
      .service-action { font-size:21px; margin-top:12px; }
      .continuous-journey { min-height:200px; padding-top:30px; }
      .journey-line { top:36px; }
      .journey-stops li { padding-top:39px; }
      .journey-stops h3 { font-size:26px; }
      .journey-stops p { font-size:18px; }
      .journey-destination { padding-top:15px; }
      .journey-destination strong { font-size:43px; }
      .intro-composition { grid-template-columns:190px 1fr; gap:18px 50px; }
      .brand-seal { width:180px; height:180px; font-size:135px; }
      .brand-definition { font-size:16px; margin-top:18px; }
      .intro-copy .lead { font-size:36px; }
      .intro-copy.has-matching { gap:19px; }
      .intro-copy.has-matching .lead { font-size:29px; }
      .matching-input p { font-size:21px; }
      .matching-input h3 { font-size:15px; }
      .matching-input .matching-permission { font-size:15px; }
      .matching-result h3 { font-size:24px; }
      .matching-result p { font-size:17px; }
      .proposal-steps li { padding-top:12px; }
      .proposal-steps p { font-size:20px; }
      .comparison-chart { gap:22px; }
      .comparison-result strong { font-size:62px; }
      .comparison-label { font-size:24px; }
      .sample-total strong { font-size:55px; }
      .video .slide-title { font-size:32px; }
      .video-frame { width:min(100%,1100px,calc((100svh - 310px) * 16 / 9)); }
      .program-layout { grid-template-columns:minmax(0,1fr) 230px; gap:40px; }
      .program-copy { padding:12px 0; gap:20px; }
      .visit-number { font-size:48px; }
      .pottery-timeline li::before { top:35px; }
      .pottery-timeline h3 { font-size:27px; margin-top:16px; }
      .pottery-timeline p { font-size:18px; }
      .program-copy>.takeaway { font-size:23px; }
      .leader-layout { grid-template-columns:minmax(0,1fr) 220px; gap:45px; }
      .contribution-stairs { min-height:240px; }
      .contribution-steps h3 { font-size:24px; }
      .contribution-steps p { font-size:17px; }
      .leader-copy>.takeaway { font-size:21px; }
      .zone-layout { grid-template-columns:1.05fr .9fr 205px; gap:16px 30px; }
      .target-svg { max-height:310px; }
      .zone-range { font-size:58px; }
      .zone-points { gap:13px; }
      .zone-points li { font-size:19px; padding-top:12px; }
      .provider-layout { grid-template-columns:minmax(0,1fr) 220px; gap:18px 25px; }
      .provider-points { gap:22px; }
      .provider-points li { font-size:21px; }

<body>
  <main id="deck" class="deck" aria-label="講 プレゼンテーション">
    <p class="load-error">資料を読み込んでいます。</p>
  </main>
  <footer class="deck-footer" aria-label="発表の操作">
    <progress id="progress" class="progress" max="1" value="1" aria-label="スライドの進捗"></progress>
    <span class="deck-brand">講</span>
    <nav class="slide-nav" aria-label="スライドを移動">
      <button id="previous" class="control nav-control" type="button" aria-label="前のスライド" aria-keyshortcuts="ArrowLeft">←</button>
      <span id="counter" class="slide-counter"></span>
      <button id="next" class="control nav-control" type="button" aria-label="次のスライド" aria-keyshortcuts="ArrowRight">→</button>
    </nav>
    <div class="footer-actions">
      <button id="notes-toggle" class="control" type="button" aria-expanded="false" aria-controls="notes-panel" aria-keyshortcuts="N" title="発表者原稿を開閉（N）">原稿 <span aria-hidden="true">N</span></button>
      <button id="fullscreen" class="control" type="button" aria-pressed="false" aria-keyshortcuts="F" title="全画面を切り替え（F）">全画面 <span aria-hidden="true">F</span></button>
      <button id="timer-toggle" class="control" type="button" aria-pressed="false">計時開始</button>
      <span id="timer" class="timer-text" aria-label="経過時間">00:00</span>
      <button id="timer-reset" class="control" type="button" aria-label="計時をリセット" title="計時をリセット">↺</button>
    </div>
  </footer>
  <aside id="notes-panel" class="notes-panel" aria-labelledby="notes-heading" hidden>
    <div class="notes-heading"><h2 id="notes-heading">発表者原稿</h2><button id="notes-close" class="control" type="button" aria-label="原稿を閉じる">閉じる</button></div>
    <h3 id="notes-title" class="notes-title"></h3>
    <p id="notes-time" class="notes-time"></p>
    <div id="notes-speaker" class="notes-speaker" hidden></div>
    <div id="notes-copy" class="notes-copy"></div>
    <div id="notes-handoff" class="notes-handoff" hidden></div>
    <div id="notes-sources" class="notes-sources" aria-label="このページの出典"></div>
    <p class="notes-help">← →：ページ移動　Home / End：最初 / 最後<br>N：原稿　F：全画面　Esc：原稿を閉じる<br>動画は手動再生です。ページを離れると一時停止します。</p>
  </aside>
  <p id="announcement" class="visually-hidden" aria-live="polite" aria-atomic="true"></p>
  <noscript><p class="load-error">この資料の表示にはJavaScriptが必要です。</p></noscript>
  <script src="presentation-content.js"></script>
  <script>
    (() => {
      "use strict";
      const content = window.KOU_DECK;
      const deck = document.getElementById("deck");
      if (!content || !Array.isArray(content.slides) || content.slides.length === 0) {
        deck.replaceChildren(Object.assign(document.createElement("p"), { className: "load-error", textContent: "資料を読み込めませんでした。presentation-content.js をこのHTMLと同じフォルダーに置いて開き直してください。" }));
        document.querySelectorAll(".deck-footer button").forEach(button => { button.disabled = true; });
        return;
      }

      const slides = content.slides.map(slide => ({
        ...slide,
        layout: slide.type === "business" ? "provider" : slide.type,
        kicker: slide.section,
        lead: slide.subtitle,
        seconds: slide.duration,
        points: slide.items,
        rawMetrics: slide.metrics,
        steps: slide.steps?.map(step => ({ title: step.title, text: step.description })),
        metrics: slide.metrics?.map(metric => ({ value: `${metric.count}人`, label: metric.label, note: `回答${metric.total}人の${metric.percent}%` })),
        video: slide.type === "video" ? content.video : undefined,
      }));
      const totalSeconds = Number(content.duration) || slides.reduce((sum, slide) => sum + (Number(slide.seconds) || 0), 0);
      const limitSeconds = Number(content.limit) || totalSeconds;
      const element = (tag, className, text) => {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text !== undefined && text !== null) node.textContent = String(text);
        return node;
      };
      const localUrl = value => {
        if (typeof value !== "string" || !value || /^[a-z][a-z\d+.-]*:/i.test(value) || value.startsWith("//") || value.includes("\\")) return null;
        return value;
      };
      const safeLink = value => {
        if (typeof value !== "string") return null;
        if (/^https?:\/\//i.test(value)) return value;
        return localUrl(value);
      };
      const appendLead = (container, slide) => {
        if (!slide.lead) return;
        const lead = element("p", "lead");
        if (slide.layout === "cover") {
          const phrases = slide.lead.split(/(?<=[、。！？])/u).filter(Boolean);
          phrases.forEach((phrase, index) => {
            if (index) lead.append(element("wbr"));
            lead.append(element("span", "lead-phrase", phrase));
          });
        } else lead.textContent = slide.lead;
        container.append(lead);
      };
      const appendPoints = (container, points, className = "points") => {
        if (!Array.isArray(points) || points.length === 0) return;
        const list = element("ol", className);
        points.forEach(point => {
          const li = element("li");
          if (typeof point === "string") li.textContent = point;
          else {
            const group = element("div");
            if (point.title) group.append(element("h3", "", point.title));
            if (point.text || point.body) group.append(element("p", "", point.text || point.body));
            li.append(group);
          }
          list.append(li);
        });
        container.append(list);
      };
      const appendMetrics = (container, metrics) => {
        if (!Array.isArray(metrics) || metrics.length === 0) return;
        const group = element("div", "metrics");
        metrics.forEach(metric => {
          const item = element("p", "metric");
          item.append(element("strong", "metric-value", metric.value));
          item.append(element("span", "metric-label", metric.label));
          if (metric.note) item.append(element("span", "metric-note", metric.note));
          group.append(item);
        });
        container.append(group);
      };
      const visual = (slide, phone = false) => {
        const imageSource = typeof slide.image === "object" ? slide.image.src : slide.image;
        const path = localUrl(imageSource);
        if (!path) return null;
        const figure = element("figure", `visual${phone ? " phone" : ""}`);
        const image = element("img");
        image.src = path;
        const descriptions = {
          program: "通う旅の進捗と各工程を表示した利用者画面",
          leader: "階級と確認済みの活動を表示した旅の手帳画面",
          zone: "対象地域への追加割引と利用条件を表示したクーポン画面",
          provider: "N西市全体の来訪・再訪集計を表示した事業者画面",
        };
        image.alt = slide.imageAlt || (typeof slide.image === "object" && slide.image.alt) || descriptions[slide.layout] || "";
        image.decoding = "async";
        figure.append(image);
        const caption = slide.imageCaption || (typeof slide.image === "object" && slide.image.caption);
        if (caption) figure.append(element("figcaption", "", caption));
        return figure;
      };
      const renderVideo = (container, slide) => {
        appendLead(container, slide);
        const videoData = typeof slide.video === "object" ? slide.video : { src: slide.video };
        const videoSource = localUrl(videoData.src) || "../outputs/kou-revisit-intro-v13.mp4";
        const frame = element("figure", "video-frame");
        const video = element("video");
        video.controls = true;
        video.playsInline = true;
        video.preload = "metadata";
        video.src = videoSource;
        video.setAttribute("aria-label", slide.videoLabel || "講の実操作紹介動画");
        const poster = localUrl(videoData.poster || slide.poster);
        if (poster) video.poster = poster;
        const captions = localUrl(videoData.captions);
        if (captions) {
          const track = element("track");
          track.kind = "captions"; track.srclang = "ja"; track.label = "日本語"; track.src = captions;
          video.append(track);
        }
        video.append(element("p", "", "動画を再生できません。ローカルの動画ファイルを確認してください。"));
        frame.append(video);
        const caption = element("figcaption", "video-caption", slide.videoCaption || "再生ボタンで開始します。音量は動画の操作欄で調整できます。");
        frame.append(caption);
        video.addEventListener("error", () => { caption.textContent = "動画を読み込めませんでした。outputs/kou-revisit-intro-v13.mp4 があるか確認してください。"; });
        container.append(frame);
        const printed = element("div", "video-print");
        if (poster) {
          const image = element("img"); image.src = poster; image.alt = "実操作紹介動画の一場面"; printed.append(image);
        }
        printed.append(element("p", "", "実操作紹介動画：kou-revisit-intro-v13.mp4"));
        if (slide.videoCaption) printed.append(element("p", "", slide.videoCaption));
        container.append(printed);
      };
      const svgElement = (tag, attributes = {}, text) => {
        const node = document.createElementNS("http://www.w3.org/2000/svg", tag);
        Object.entries(attributes).forEach(([key, value]) => node.setAttribute(key, String(value)));
        if (text !== undefined) node.textContent = String(text);
        return node;
      };
      const diagram = (className, viewBox, label) => {
        const svg = svgElement("svg", { class: className, viewBox, preserveAspectRatio: "none" });
        if (label) { svg.setAttribute("role", "img"); svg.setAttribute("aria-label", label); }
        else svg.setAttribute("aria-hidden", "true");
        return svg;
      };
      const addTakeaway = (body, slide) => { if (slide.takeaway) body.append(element("p", "takeaway", slide.takeaway)); };
      const serviceWindows = slide => {
        const body = element("div", "slide-body friction-layout");
        appendLead(body, slide);
        const islands = element("div", "service-islands");
        const paths = diagram("service-links", "0 0 1000 360");
        paths.append(
          svgElement("path", { d:"M245 120 C330 105 280 260 390 260", fill:"none", stroke:"#b63d30", "stroke-width":2, "stroke-dasharray":"9 12" }),
          svgElement("path", { d:"M610 250 C700 250 660 125 770 115", fill:"none", stroke:"#b63d30", "stroke-width":2, "stroke-dasharray":"9 12" }),
          svgElement("path", { d:"M795 170 C800 335 360 360 320 290", fill:"none", stroke:"#9daaa2", "stroke-width":1.5, "stroke-dasharray":"7 12" }),
          svgElement("path", { d:"M376 252 L390 260 L376 267 M756 109 L770 115 L759 126 M314 306 L320 290 L333 299", fill:"none", stroke:"#b63d30", "stroke-width":2 })
        );
        islands.append(paths);
        (slide.stages || []).forEach(stage => {
          const windowPanel = element("article", "service-window");
          const bar = element("div", "window-bar");
          const dots = element("span", "window-dots"); dots.setAttribute("aria-hidden", "true");
          for (let n = 0; n < 3; n += 1) dots.append(element("i"));
          bar.append(dots);
          const tint = stage.service === "LINE" ? " service-line" : stage.service === "Instagram" ? " service-instagram" : "";
          windowPanel.append(bar, element("h3", "service-name" + tint, stage.service), element("p", "service-action", stage.action));
          islands.append(windowPanel);
        });
        body.append(islands);
        addTakeaway(body, slide);
        return body;
      };
      const continuousJourney = slide => {
        const body = element("div", "slide-body essence-layout");
        appendLead(body, slide);
        const journey = element("div", "continuous-journey");
        const line = diagram("journey-line", "0 0 1000 130");
        line.append(svgElement("path", { d:"M10 50 H955", fill:"none", stroke:"#2e6254", "stroke-width":3 }));
        [30, 350, 680].forEach(cx => line.append(svgElement("circle", { cx, cy:50, r:7, fill:"#b63d30" })));
        line.append(svgElement("path", { d:"M940 39 L955 50 L940 61", fill:"none", stroke:"#2e6254", "stroke-width":3 }));
        const stops = element("ol", "journey-stops");
        (slide.gaps || []).forEach(gap => {
          const stop = element("li");
          stop.append(element("h3", "", gap.title), element("p", "", gap.problem));
          stops.append(stop);
        });
        journey.append(line, stops);
        const destination = element("p", "journey-destination");
        destination.append(element("span", "", "準備をひと続きに"), element("strong", "", "気軽な再訪へ"));
        body.append(journey, destination);
        return body;
      };
      const introduction = slide => {
        const body = element("div", "slide-body intro-composition");
        const identity = element("div");
        const seal = element("div", "brand-seal", slide.title); seal.setAttribute("aria-hidden", "true");
        identity.append(seal);
        if (slide.definition) identity.append(element("p", "brand-definition", slide.definition));
        const copy = element("div", "intro-copy"); appendLead(copy, slide);
        if (slide.matching) {
          body.classList.add("with-matching");
          copy.classList.add("has-matching");
          const equation = element("div", "matching-equation");
          const community = element("div", "matching-input");
          community.append(element("h3", "", "既存コミュニティ"), element("p", "", slide.matching.community));
          const times = element("span", "matching-times", "×");
          times.setAttribute("aria-label", "と掛け合わせる");
          const interests = element("div", "matching-input");
          interests.append(element("h3", "", "個人の趣味・嗜好"), element("p", "", slide.matching.interests));
          if (slide.matching.permission) interests.append(element("p", "matching-permission", slide.matching.permission));
          equation.append(community, times, interests);
          const result = element("div", "matching-result");
          const arrow = element("span", "matching-result-arrow", "↓"); arrow.setAttribute("aria-hidden", "true");
          const resultCopy = element("div");
          resultCopy.append(element("h3", "", slide.matching.result), element("p", "", slide.matching.consent));
          result.append(arrow, resultCopy);
          copy.append(equation, result);
        }
        body.append(identity, copy);
        const woodcut = visual(slide);
        if (woodcut) { woodcut.className = "woodcut"; woodcut.setAttribute("aria-hidden", "true"); body.append(woodcut); }
        const steps = element("ol", "proposal-steps");
        (slide.prompts || []).forEach((prompt, index) => {
          const step = element("li");
          step.append(element("span", "proposal-index", String(index + 1).padStart(2, "0")), element("p", "", prompt));
          steps.append(step);
        });
        body.append(steps);
        return body;
      };
      const evidence = slide => {
        const body = element("div", "slide-body evidence-layout"); appendLead(body, slide);
        const chart = element("div", "comparison-chart");
        const metrics = slide.rawMetrics || [];
        const maximum = Math.max(1, ...metrics.map(item => Number(item.count) || 0));
        const axisMaximum = Math.ceil(maximum / 20) * 20;
        metrics.forEach(metric => {
          const row = element("div", "comparison-row");
          row.append(element("h3", "comparison-label", metric.label));
          const result = element("p", "comparison-result");
          const count = element("strong", "", metric.count); count.append(element("small", "", " 人"));
          result.append(count, element("span", "", metric.percent + "%"));
          const track = element("div", "bar-track"); track.setAttribute("aria-hidden", "true");
          const fill = element("div", "bar-fill"); fill.style.width = (Number(metric.count) / axisMaximum * 100) + "%";
          track.append(fill); row.append(result, track); chart.append(row);
        });
        const scale = element("div", "chart-scale"); scale.setAttribute("aria-hidden", "true");
        for (let count = 0; count <= axisMaximum; count += 20) scale.append(element("span", "", count === axisMaximum ? count + " 人" : count));
        chart.append(scale);
        const sample = element("p", "sample-total");
        const total = metrics[0]?.total;
        if (total !== undefined) {
          sample.append(element("span", "", "回答した人"));
          const number = element("strong", "", total); number.append(element("small", "", " 人"));
          sample.append(number, element("span", "", "複数のテーマを集計"));
        }
        body.append(chart, sample); addTakeaway(body, slide); return body;
      };
      const program = slide => {
        const body = element("div", "slide-body program-layout");
        const copy = element("div", "program-copy"); appendLead(copy, slide);
        const timeline = element("ol", "pottery-timeline");
        (slide.steps || []).forEach((step, index) => {
          const item = element("li");
          const number = element("span", "visit-number", String(index + 1).padStart(2, "0")); number.append(element("small", "", "回目"));
          item.append(number, element("h3", "", step.title), element("p", "", step.text)); timeline.append(item);
        });
        copy.append(timeline); addTakeaway(copy, slide); body.append(copy);
        const picture = visual(slide, true); if (picture) body.append(picture);
        return body;
      };
      const leader = slide => {
        const body = element("div", "slide-body leader-layout");
        const copy = element("div", "leader-copy"); appendLead(copy, slide);
        const stairs = element("div", "contribution-stairs");
        const line = diagram("stairs-line", "0 0 760 260");
        line.append(svgElement("path", { d:"M10 135 H250 V75 H490 V15 H735", fill:"none", stroke:"#b63d30", "stroke-width":2 }), svgElement("path", { d:"M720 5 L735 15 L720 25", fill:"none", stroke:"#b63d30", "stroke-width":2 }));
        const steps = element("ol", "contribution-steps");
        (slide.steps || []).forEach((step, index) => {
          const item = element("li");
          item.append(element("span", "step-index", String(index + 1).padStart(2, "0")), element("h3", "", step.title), element("p", "", step.text)); steps.append(item);
        });
        stairs.append(line, steps); copy.append(stairs); addTakeaway(copy, slide); body.append(copy);
        const picture = visual(slide, true); if (picture) body.append(picture);
        return body;
      };
      const targetZone = slide => {
        const body = element("div", "slide-body zone-layout"); appendLead(body, slide);
        const range = slide.range || {};
        const min = Number(range.min) || 0; const max = Math.max(Number(range.max) || 1, min);
        const outer = 150; const inner = outer * min / max;
        const figure = element("figure", "target-figure");
        const svg = diagram("target-svg", "0 0 400 400", "事業者を中心に" + min + "から" + max + range.unit + "を示す参考距離の模式図。実地図ではありません。");
        svg.setAttribute("preserveAspectRatio", "xMidYMid meet");
        svg.append(
          svgElement("circle", { cx:200, cy:200, r:(outer + inner) / 2, fill:"none", stroke:"#b63d30", "stroke-opacity":.13, "stroke-width":outer - inner }),
          svgElement("circle", { cx:200, cy:200, r:outer, fill:"none", stroke:"#b63d30", "stroke-width":2 }),
          svgElement("circle", { cx:200, cy:200, r:inner, fill:"none", stroke:"#b63d30", "stroke-width":1.5 }),
          svgElement("path", { d:"M200 30 V370 M30 200 H370", fill:"none", stroke:"#b7c3b9", "stroke-width":1, "stroke-dasharray":"3 7" }),
          svgElement("circle", { cx:200, cy:200, r:5, fill:"#192724" }),
          svgElement("rect", { x:158, y:213, width:84, height:32, fill:"#fafbf8" }),
          svgElement("text", { x:200, y:235, "text-anchor":"middle", fill:"#192724", "font-size":20 }, "事業者"),
          svgElement("text", { x:200 + inner - 5, y:190, "text-anchor":"end", fill:"#b63d30", "font-size":20 }, min + "km"),
          svgElement("text", { x:200 + outer, y:185, "text-anchor":"middle", fill:"#b63d30", "font-size":22 }, max + "km")
        );
        figure.append(svg, element("figcaption", "", "参考距離の模式図"));
        const copy = element("div", "zone-copy");
        const number = element("p", "zone-range", min + "–" + max); number.append(element("small", "", range.unit || "km"));
        const points = element("ul", "zone-points"); (slide.points || []).forEach(point => points.append(element("li", "", point)));
        copy.append(number, points); body.append(figure, copy);
        const picture = visual(slide, true); if (picture) body.append(picture);
        return body;
      };
      const provider = slide => {
        const body = element("div", "slide-body provider-layout"); appendLead(body, slide);
        const picture = visual(slide); if (picture) body.append(picture);
        const points = element("ul", "provider-points"); (slide.points || []).forEach(point => points.append(element("li", "", point)));
        body.append(points); return body;
      };
      const renderBody = slide => {
        const renderers = { friction: serviceWindows, essence: continuousJourney, cover: introduction, evidence, program, leader, zone: targetZone, provider };
        if (slide.layout === "video") {
          const body = element("div", "slide-body"); renderVideo(body, slide); return body;
        }
        const renderer = renderers[slide.layout];
        if (renderer) return renderer(slide);
        const body = element("div", "slide-body content-stack"); appendLead(body, slide); appendPoints(body, slide.points); return body;
      };
      const renderSlide = (slide, index) => {
        const section = element("section", `slide ${slide.layout || "evidence"}`);
        section.id = `slide-${index + 1}`;
        section.hidden = index !== 0;
        section.setAttribute("aria-labelledby", `title-${index + 1}`);
        section.setAttribute("aria-roledescription", "スライド");
        const header = element("header", "slide-header");
        const titleGroup = element("div");
        if (slide.kicker || slide.eyebrow) titleGroup.append(element("p", "eyebrow", slide.kicker || slide.eyebrow));
        const title = element(index === 0 ? "h1" : "h2", "slide-title", slide.title);
        title.id = `title-${index + 1}`;
        titleGroup.append(title);
        header.append(titleGroup, element("p", "folio", `${String(index + 1).padStart(2, "0")} / ${String(slides.length).padStart(2, "0")}`));
        section.append(header, renderBody(slide));
        const footnote = slide.caption || slide.footnote;
        if (footnote) {
          const footer = element("div", "slide-footnote");
          if (footnote) footer.append(element("p", "", footnote));
          section.append(footer);
        }
        return section;
      };

      document.title = content.title || "講 — プレゼンテーション";
      const sections = slides.map(renderSlide);
      deck.replaceChildren(...sections);
      const previous = document.getElementById("previous");
      const next = document.getElementById("next");
      const progress = document.getElementById("progress");
      const counter = document.getElementById("counter");
      const notesPanel = document.getElementById("notes-panel");
      const notesToggle = document.getElementById("notes-toggle");
      const fullscreen = document.getElementById("fullscreen");
      const timerToggle = document.getElementById("timer-toggle");
      const timerDisplay = document.getElementById("timer");
      let current = 0;
      let elapsed = 0;
      let startedAt = null;
      let interval = null;
      progress.max = slides.length;
      const timeText = value => `${String(Math.floor(value / 60)).padStart(2, "0")}:${String(Math.floor(value % 60)).padStart(2, "0")}`;
      const pauseVideos = () => deck.querySelectorAll("video").forEach(video => video.pause());
      const updateNotes = () => {
        const slide = slides[current];
        document.getElementById("notes-title").textContent = `${current + 1}. ${slide.title}`;
        const prior = slides.slice(0, current).reduce((sum, item) => sum + (Number(item.seconds) || 0), 0);
        const seconds = Number(slide.seconds) || 0;
        document.getElementById("notes-time").textContent = `このページ ${seconds}秒 ／ 目安 ${timeText(prior)}–${timeText(prior + seconds)}`;
        const copy = document.getElementById("notes-copy");
        const paragraphs = Array.isArray(slide.notes) ? slide.notes : [slide.notes || "このページの原稿はありません。"];
        copy.replaceChildren(...paragraphs.map(text => element("p", "", text)));
        const speaker = document.getElementById("notes-speaker");
        speaker.replaceChildren();
        speaker.hidden = !slide.speaker;
        if (slide.speaker) {
          speaker.append(element("strong", "", `担当：${slide.speaker}`));
          if (slide.speaker_role) speaker.append(element("span", "", slide.speaker_role));
        }
        const handoff = document.getElementById("notes-handoff");
        handoff.replaceChildren();
        handoff.hidden = !slide.handoff;
        if (slide.handoff) {
          handoff.append(element("strong", "", `引継ぎ → ${slide.handoff.to}`));
          if (slide.handoff.text) handoff.append(element("p", "", slide.handoff.text));
        }
        const sourceLinks = document.getElementById("notes-sources");
        sourceLinks.replaceChildren();
        (slide.sources || []).forEach(source => {
          const path = safeLink(typeof source === "string" ? source : source.href || source.url);
          if (!path) return;
          const link = element("a", "", typeof source === "string" ? source.replace(/^\.\.\//, "") : source.label || source.title || "出典");
          link.href = path; link.target = "_blank"; link.rel = "noopener noreferrer";
          sourceLinks.append(link);
        });
        notesPanel.scrollTop = 0;
      };
      const showSlide = (index, announce = true) => {
        const target = Math.min(slides.length - 1, Math.max(0, index));
        if (target !== current) pauseVideos();
        current = target;
        deck.classList.toggle("theater-mode", slides[current].layout === "video");
        sections.forEach((section, number) => { section.hidden = number !== current; });
        previous.disabled = current === 0;
        next.disabled = current === slides.length - 1;
        counter.textContent = `${current + 1} / ${slides.length}`;
        progress.value = current + 1;
        deck.scrollTop = 0;
        updateNotes();
        if (announce) document.getElementById("announcement").textContent = `${current + 1} / ${slides.length}、${slides[current].title}`;
        try { history.replaceState(null, "", `#slide-${current + 1}`); } catch { /* Some file viewers disable history updates. */ }
      };
      const toggleNotes = force => {
        const open = typeof force === "boolean" ? force : notesPanel.hidden;
        notesPanel.hidden = !open;
        notesToggle.setAttribute("aria-expanded", String(open));
        if (open) document.getElementById("notes-close").focus();
        else notesToggle.focus();
      };
      const toggleFullscreen = async () => {
        try {
          if (document.fullscreenElement) await document.exitFullscreen();
          else await document.documentElement.requestFullscreen();
        } catch {
          document.getElementById("announcement").textContent = "全画面に切り替えられませんでした。ブラウザーの全画面操作をお使いください。";
        }
      };
      const updateTimer = () => {
        const seconds = elapsed + (startedAt === null ? 0 : (performance.now() - startedAt) / 1000);
        timerDisplay.textContent = `${timeText(seconds)} / ${timeText(totalSeconds)}`;
        timerDisplay.classList.toggle("over", seconds > limitSeconds);
        timerDisplay.title = `目標 ${timeText(totalSeconds)} ／ 上限 ${timeText(limitSeconds)}`;
      };
      const pauseTimer = () => {
        if (startedAt !== null) elapsed += (performance.now() - startedAt) / 1000;
        startedAt = null;
        if (interval !== null) clearInterval(interval);
        interval = null;
        timerToggle.textContent = elapsed ? "計時再開" : "計時開始";
        timerToggle.setAttribute("aria-pressed", "false");
        updateTimer();
      };
      previous.addEventListener("click", () => showSlide(current - 1));
      next.addEventListener("click", () => showSlide(current + 1));
      notesToggle.addEventListener("click", () => toggleNotes());
      document.getElementById("notes-close").addEventListener("click", () => toggleNotes(false));
      fullscreen.addEventListener("click", () => { void toggleFullscreen(); });
      document.addEventListener("fullscreenchange", () => {
        const active = Boolean(document.fullscreenElement);
        fullscreen.setAttribute("aria-pressed", String(active));
        fullscreen.textContent = active ? "全画面を終了" : "全画面 F";
      });
      if (!document.documentElement.requestFullscreen) fullscreen.hidden = true;
      timerToggle.addEventListener("click", () => {
        if (startedAt !== null) { pauseTimer(); return; }
        startedAt = performance.now();
        timerToggle.textContent = "計時停止";
        timerToggle.setAttribute("aria-pressed", "true");
        interval = setInterval(updateTimer, 250);
        updateTimer();
      });
      document.getElementById("timer-reset").addEventListener("click", () => { pauseTimer(); elapsed = 0; timerToggle.textContent = "計時開始"; updateTimer(); });
      document.addEventListener("keydown", event => {
        if (event.defaultPrevented || event.ctrlKey || event.altKey || event.metaKey || event.isComposing) return;
        const target = event.target instanceof Element ? event.target : null;
        if (target?.closest("input, textarea, select, video, audio, [contenteditable='true'], [role='textbox']")) return;
        if (event.key === "Escape" && !notesPanel.hidden) { event.preventDefault(); toggleNotes(false); return; }
        if (event.key.toLowerCase() === "n") { event.preventDefault(); toggleNotes(); return; }
        if (event.key.toLowerCase() === "f") { event.preventDefault(); void toggleFullscreen(); return; }
        if (target?.closest(".notes-panel")) return;
        const targets = { ArrowRight: current + 1, ArrowLeft: current - 1, Home: 0, End: slides.length - 1 };
        if (Object.hasOwn(targets, event.key)) { event.preventDefault(); showSlide(targets[event.key]); }
      });
      document.addEventListener("visibilitychange", () => { if (document.hidden) pauseVideos(); });
      window.addEventListener("pagehide", () => { pauseVideos(); pauseTimer(); });
      window.addEventListener("beforeprint", pauseVideos);
      const initial = /^#slide-(\d+)$/.exec(location.hash);
      showSlide(initial ? Number(initial[1]) - 1 : 0, false);
      updateTimer();
    })();
  </script>
</body>
</html>
