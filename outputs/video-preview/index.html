<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>講｜操作紹介</title>
<style>
body{margin:0;background:#f5f0e4;color:#342f24;font-family:Meiryo,sans-serif}
main{max-width:1280px;margin:auto;padding:24px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:24px}
h1{font-size:24px;font-weight:600}p{font-size:15px}
video{display:block;width:100%;border:1px solid #cdbd9e;background:#e9e0ce;box-shadow:0 8px 30px #3f352414}
button{font:inherit;border:1px solid #a79370;border-radius:3px;padding:9px 14px;background:#fcf9f0;color:#463e2e;cursor:pointer;margin-top:16px}
button:hover,button:focus-visible{background:#eee2c9;outline:2px solid #9b3d2e;outline-offset:2px}
output{font-variant-numeric:tabular-nums}
@media(max-width:600px){main{padding:12px}header{display:block}h1{font-size:20px}}
</style>
<main>
<header><h1>講｜操作紹介</h1><p>第13版 <output id="elapsed">0:00 / 1:18</output></p></header>
<video controls playsinline preload="auto" aria-label="講の操作紹介、第13版、約78秒">
<source src="kou-revisit-intro-v13.mp4" type="video/mp4">
<track kind="captions" srclang="ja" label="日本語の読み上げ" src="narration-ja.vtt">
</video>
<button id="restart">最初から再生</button>
</main>
<script>
const video=document.querySelector('video');
const time=document.getElementById('elapsed');
const format=value=>{const s=Math.round(value);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
video.addEventListener('timeupdate',()=>{time.value=format(video.currentTime)+' / '+format(video.duration||77.9)});
document.getElementById('restart').addEventListener('click',()=>{video.currentTime=0;video.play().catch(()=>{});});
</script>
</html>
