target-version = "py312"
line-length = 100

[lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[lint.flake8-bugbear]
# FastAPI documents Depends(...) as a declarative dependency marker, not a
# per-request mutable default value. All other B008 call defaults remain checked.
extend-immutable-calls = ["fastapi.Depends", "Depends"]
