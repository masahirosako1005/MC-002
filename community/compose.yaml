name: kou-community
services:
  app:
    build: .
    environment:
      APP_DB_PATH: /app/data/community.db
      MEDIA_DIR: /app/data/media
      MODEL_DIR: /app/models
      SEED_ASSET_DIR: /app/seed-assets
      STATIC_DIR: /app/static
      APP_ALLOWED_ORIGINS: http://localhost:8081,http://127.0.0.1:8081,http://localhost:8001,http://127.0.0.1:8001
    volumes:
      - community-data:/app/data
      - type: bind
        source: ./models
        target: /app/models
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./assets
        target: /app/seed-assets
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 100
    mem_limit: 768m
    cpus: 1.5
    restart: unless-stopped
    networks: [local-only]
  gateway:
    image: nginx:stable-alpine
    user: "101:101"
    entrypoint: ["nginx", "-g", "daemon off;"]
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      app:
        condition: service_healthy
        restart: true
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 40
    mem_limit: 64m
    cpus: 0.5
    restart: unless-stopped
    networks: [local-only, browser-entry]
networks:
  browser-entry:
  local-only:
    internal: true
volumes:
  community-data:
